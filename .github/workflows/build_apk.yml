name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Organize Files and Setup Android
        run: |
          # 1. Back up all files
          mkdir -p /tmp/app_src
          cp -r * /tmp/app_src/ 2>/dev/null || true

          # 2. Create clean Android project with valid package name
          flutter create . --project-name dark_anime_wallpapers --platforms=android --org com.darkanime.wallpapers

          # 3. Restore all Dart code into lib/ structure
          mkdir -p lib/models lib/screens lib/services
          [ -f /tmp/app_src/main.dart ] && cp -f /tmp/app_src/main.dart lib/main.dart
          [ -f /tmp/app_src/wallpaper.dart ] && cp -f /tmp/app_src/wallpaper.dart lib/models/wallpaper.dart
          [ -f /tmp/app_src/home_screen.dart ] && cp -f /tmp/app_src/home_screen.dart lib/screens/home_screen.dart
          [ -f /tmp/app_src/wallpaper_detail_screen.dart ] && cp -f /tmp/app_src/wallpaper_detail_screen.dart lib/screens/wallpaper_detail_screen.dart
          [ -f /tmp/app_src/ad_service.dart ] && cp -f /tmp/app_src/ad_service.dart lib/services/ad_service.dart
          [ -f /tmp/app_src/wallpaper_service.dart ] && cp -f /tmp/app_src/wallpaper_service.dart lib/services/wallpaper_service.dart
          [ -f /tmp/app_src/pubspec.yaml ] && cp -f /tmp/app_src/pubspec.yaml pubspec.yaml
          [ -f /tmp/app_src/wallpapers.json ] && cp -f /tmp/app_src/wallpapers.json wallpapers.json

          # 4. Restore custom permissions manifest
          if [ -f /tmp/app_src/AndroidManifest.xml ]; then
            cp -f /tmp/app_src/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          # 5. Set Android minSdk to 24 (for modern gallery & wallpaper support)
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 24/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Anime-Wallpaper-APK
          path: build/app/outputs/flutter-apk/app-release.apk
