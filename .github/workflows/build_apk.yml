name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Organize Files and Setup Android
        run: |
          # 1. Structure Flutter folders
          mkdir -p lib/models lib/screens lib/services
          [ -f main.dart ] && mv -f main.dart lib/
          [ -f wallpaper.dart ] && mv -f wallpaper.dart lib/models/
          [ -f home_screen.dart ] && mv -f home_screen.dart lib/screens/
          [ -f wallpaper_detail_screen.dart ] && mv -f wallpaper_detail_screen.dart lib/screens/
          [ -f ad_service.dart ] && mv -f ad_service.dart lib/services/
          [ -f wallpaper_service.dart ] && mv -f wallpaper_service.dart lib/services/

          # 2. Backup AndroidManifest
          mkdir -p /tmp/backup
          if [ -f AndroidManifest.xml ]; then
            mv AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          elif [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          fi

          # 3. Create fresh Android scaffolding
          flutter create . --platforms=android --org com.darkanime.wallpapers

          # 4. Restore custom permissions manifest
          if [ -f /tmp/backup/AndroidManifest.xml ]; then
            cp -f /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          # 5. Set Android minSdk to 24 (for modern gallery & wallpaper support)
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Anime-Wallpaper-APK
          path: build/app/outputs/flutter-apk/app-release.apk
