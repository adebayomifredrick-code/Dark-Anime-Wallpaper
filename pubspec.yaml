name: dark_anime_wallpapers
description: "A modern dark anime wallpaper app with AMOLED theme, gallery saving, and wallpaper setter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Image caching & loading
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  
  # Modern MediaStore Gallery Saver (Android 10-14+ compliant)
  gal: ^2.3.0
  
  # Wallpaper Manager (Home, Lock, Both)
  async_wallpaper: ^2.1.0
  
  # Ads Monetization
  google_mobile_ads: ^5.1.0
  
  # Utilities
  http: ^1.2.1
  shared_preferences: ^2.2.3
  share_plus: ^10.0.0
  flutter_spinkit: ^5.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
